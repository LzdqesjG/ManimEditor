<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManimEditor</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="toolbar">
    <span class="brand">ManimEditor</span>
    <label><span data-i18n="sceneName"></span>
      <input id="scene-name" value="MyScene" spellcheck="false">
    </label>
    <button id="btn-save" data-i18n="save"></button>
    <button id="btn-new" class="ghost" data-i18n="newScene"></button>
    <select id="scene-list" data-i18n-title="openScene">
      <option value="" data-i18n="openScene"></option>
    </select>
    <label><span data-i18n="quality"></span>
      <select id="quality">
        <option value="low" data-i18n="qualityLow"></option>
        <option value="medium" data-i18n="qualityMedium"></option>
        <option value="high" data-i18n="qualityHigh"></option>
      </select>
    </label>
    <label><span data-i18n="sceneType"></span>
      <select id="scene-type">
        <option value="Scene">2D Scene</option>
        <option value="ThreeDScene">3D ThreeDScene</option>
        <option value="MovingCameraScene">MovingCamera</option>
      </select>
    </label>
    <button id="btn-render" class="primary" data-i18n="render"></button>
    <span id="render-status" class="status"></span>
    <button id="btn-lang" class="ghost">🌏切换为中文 (简体)</button>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="panel-head">
        <input id="lib-search" data-i18n-placeholder="searchPlaceholder" spellcheck="false">
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="mobjects" data-i18n="tabMobjects"></button>
        <button class="tab" data-tab="animations" data-i18n="tabAnimations"></button>
      </div>
      <div id="lib-list" class="scroll"></div>
    </aside>

    <section class="stage">
      <div class="stage-head">
        <span data-i18n="canvasTitle"></span>
        <span id="stage-hint" class="hint" data-i18n="stageHintAdd"></span>
      </div>
      <div id="canvas-wrap" class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <video id="video" controls hidden></video>
      </div>
      <div class="timeline">
        <div class="panel-head"><span data-i18n="timeline"></span><span id="timeline-info" class="hint"></span></div>
        <div id="timeline" class="timeline-body"></div>
      </div>
    </section>

    <aside class="panel">
      <div class="tabs">
        <button class="tab active" data-tab="props" data-i18n="tabProps"></button>
        <button class="tab" data-tab="code" data-i18n="tabCode"></button>
      </div>
      <div id="panel-props" class="scroll"></div>
      <div id="panel-code" class="scroll" hidden>
        <div class="code-head">
          <span data-i18n="generatedCode"></span>
          <button id="btn-refresh-code" class="ghost" data-i18n="refresh"></button>
        </div>
        <pre id="code-view" class="code"></pre>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/state.js"></script>
  <script src="/static/js/catalog.js"></script>
  <script src="/static/js/inspector.js"></script>
  <script src="/static/js/canvas.js"></script>
  <script src="/static/js/timeline.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
